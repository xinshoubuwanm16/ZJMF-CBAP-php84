<link rel="stylesheet" href="/plugins/addon/idcsmart_statistics/template/admin/css/statistics.css" />
<!-- =======内容区域======= -->

<div id="content" class="statistics" v-cloak>
  <com-config>
    <t-card class="list-card-container">
      <ul class="common-tab">
        <li v-permission="'auth_idcsmart_statistics_year'">
          <a href="index.htm">{{lang.year_income}}</a>
        </li>
        <li v-permission="'auth_idcsmart_statistics_expect'">
          <a href="expect_income.htm">{{lang.expect_income}}</a>
        </li>
        <li v-permission="'auth_idcsmart_statistics_product'">
          <a href="product_income.htm">{{lang.product_income}}</a>
        </li>
        <li v-permission="'auth_idcsmart_statistics_month'">
          <a href="month_income.htm">{{lang.month_income}}</a>
        </li>
        <li class="active" v-permission="'auth_idcsmart_statistics_year_order'">
          <a href="javascript:;">{{lang.month_order_income}}</a>
        </li>
      </ul>
      <div class="box">
        <!-- <p class="tit">{{lang.month_order_income}}</p> -->
        <p class="des">{{lang.income_tip4}}</p>
        <p class="type">{{time}}{{lang.year}}{{calcName}}{{lang.statistics}}</p>
        <div class="charts">
          <t-loading :loading="loading" show-overlay size="small">
            <div id="monitorContainer" ref="monitorContainer"></div>
          </t-loading>
        </div>
        <div class="choose">
          <p class="item" :class="{active: item.value === curType}" v-for="(item,index) in typeArr" :key="index"
            @click="chooseType(item.value)">
            {{item.label}}
          </p>
        </div>
        <t-table row-key="1" :data="curData.list" size="medium" :columns="columns" :hover="hover" :loading="loading"
          :table-layout="tableLayout ? 'auto' : 'fixed'" display-type="fixed-width" :hide-sort-tips="true">
          <template slot="sortIcon">
            <t-icon name="caret-down-small"></t-icon>
          </template>
        </t-table>
        <p class="change-year">
          <span class="item" @click="changeNum('sub')">
            <t-icon name="chevron-left-double"></t-icon>{{time -
            1}}
          </span>
          <span class="item" v-if="time < curYear" @click="changeNum('add')">
            {{time + 1}}
            <t-icon name="chevron-right-double"></t-icon>
          </span>
        </p>
      </div>
    </t-card>
  </com-config>
</div>
<script src="/plugins/addon/idcsmart_statistics/template/admin/js/lang.js"></script>

<script src="/plugins/addon/idcsmart_statistics/template/admin/js/echarts.min.js"></script>
<script src="/plugins/addon/idcsmart_statistics/template/admin/api/statistics.js"></script>
<script src="/plugins/addon/idcsmart_statistics/template/admin/js/other_info.js"></script>
