<link rel="stylesheet" href="/plugins/addon/e_contract/template/clientarea/css/index.css">
</head>

<body>
  <!-- mounted之前显示 -->
  <div id="mainLoading">
    <div class="ddr ddr1"></div>
    <div class="ddr ddr2"></div>
    <div class="ddr ddr3"></div>
    <div class="ddr ddr4"></div>
    <div class="ddr ddr5"></div>
  </div>
  <div class="template">
    <el-container>
      <aside-menu></aside-menu>
      <el-container>
        <top-menu></top-menu>
        <el-main>
          <div class="apply-contract">
            <div class="apply-title">
              <div class="back-btn" @click="goBack">
                <img src="/plugins/addon/e_contract/template/clientarea/img/back_icon.png" alt="">
              </div>
              <div class="title-text">{{lang.contract_text9}}</div>
            </div>
            <div class="fingerprint-info">{{lang.contract_text10}}：{{infoData.fingerprint}}</div>
            <div class="signtem-box">
              <div class="contract-info" style="height: auto;" v-html="infoData.detail"></div>
            </div>

          </div>
        </el-main>
      </el-container>
    </el-container>
  </div>
  <!-- =======页面独有======= -->
  <script src="/plugins/addon/e_contract/template/clientarea/lang/index.js"></script>
  <script src="/plugins/addon/e_contract/template/clientarea/js/html2canvas.min.js"></script>
  <script src="/plugins/addon/e_contract/template/clientarea/api/index.js"></script>
  <script src="/plugins/addon/e_contract/template/clientarea/js/contractDetail.js"></script>
