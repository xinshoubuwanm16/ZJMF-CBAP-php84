<link rel="stylesheet" href="/plugins/addon/e_contract/template/admin/css/e_contract.css" />
<!-- =======内容区域======= -->
<div id="content" class="template contract_template" v-cloak>
  <com-config>
    <t-card class="list-card-container">
      <ul class="common-tab">
        <li v-permission="'auth_e_contract_list_view'">
          <a href="index.htm">{{lang.contract_list}}</a>
        </li>
        <li class="active" v-permission="'auth_e_contract_template_view'">
          <a href="javascript:;">{{lang.template_manage}}</a>
        </li>
        <li v-permission="'auth_e_contract_configuration_view'">
          <a href="contract_config.htm">{{lang.basic_setting}}</a>
        </li>
      </ul>
      <div class="box">
        <div class="common-header">
          <div class="left">
            <t-button @click="createTemplate" v-permission="'auth_e_contract_template_create_template'">{{lang.create_template}}</t-button>
          </div>
          <div class="client-search">
            <t-input v-model="params.keywords" clearable
              :placeholder="`${lang.contract}${lang.nickname}、${lang.order_hosts}`" @keyup.enter.native="seacrh"
              @clear="clearSearch"></t-input>
            <t-select v-model="params.status" :placeholder="lang.status" clearable>
              <t-option :value="1" :label="lang.promo_active" :key="1"></t-option>
              <t-option :value="0" :label="lang.has_been_discontinued" :key="0"></t-option>
            </t-select>
            <t-select v-model="params.force_sign" :placeholder="lang.is_force_sign" clearable>
              <t-option :value="1" :label="lang.is_force" :key="1"></t-option>
              <t-option :value="0" :label="lang.not_force" :key="0"></t-option>
            </t-select>
            <t-button @click="seacrh">{{lang.query}}</t-button>
          </div>
        </div>
        <t-table row-key="id" :data="list" size="medium" :columns="typeColumns" :hover="hover" :loading="loading"
          :table-layout="tableLayout ? 'auto' : 'fixed'" display-type="fixed-width" :hide-sort-tips="true">
          <template slot="sortIcon">
            <t-icon name="caret-down-small"></t-icon>
          </template>
          <template #name="{row}">
            <a :href="`create_contract_template.htm?id=${row.id}`" class="aHover">{{row.name}}</a>
          </template>
          <template #product="{row}">
            <span v-for="(item,index) in row.product" :key="index">
              <template v-if="index >= 1">、</template>
              <a :href="item.id ? `${baseUrl}product_detail.htm?id=${item.id}` : 'javascript:;'"
                class="aHover">{{item.name}}</a>
            </span>
          </template>
          <template #force_sign="{row}">
            {{row.force_sign ? lang.is_force : lang.not_force}}
          </template>
          <template #status="{row}">
            <t-switch size="small" :custom-value="[1,0]" :value="row.status" @change="changeStatus(row)"
            :disabled="!$checkPermission('auth_e_contract_template_status_on_off')">
            </t-switch>
          </template>
          <template #pay_time="{row}">
            {{row.pay_time ? moment(row.pay_time * 1000).format('YYYY-MM-DD HH:mm:ss') : '--'}}
          </template>
          <template #op="{row}">
            <t-tooltip :content="lang.copy" :show-arrow="false" theme="light" v-if="row.base_contract === 0 && $checkPermission('auth_e_contract_template_copy_template')">
              <svg class="common-look" @click="copyTem(row)">
                <use xlink:href="/plugins/addon/e_contract/template/admin/img/icons.svg#cus-copy"></use>
              </svg>
            </t-tooltip>
            <t-tooltip :content="lang.edit" :show-arrow="false" theme="light">
              <t-icon name="edit" size="18px" @click="updateItem(row)" class="common-look" v-permission="'auth_e_contract_template_update_template'"></t-icon>
            </t-tooltip>
            <t-tooltip :content="lang.delete" :show-arrow="false" theme="light">
              <t-icon name="delete" size="18px" @click="delteItem(row)" class="common-look" v-permission="'auth_e_contract_template_delete_template'"></t-icon>
            </t-tooltip>
          </template>
        </t-table>
        <t-pagination show-jumper :total="total" v-if="total" :page-size="params.limit"
          :page-size-options="pageSizeOptions" :on-change="changePage" :current="params.page" />
      </div>
    </t-card>
    <!-- 删除提示框 -->
    <t-dialog theme="warning" :header="confirmTitle" :close-btn="false" :visible.sync="delVisible">
      <template slot="footer">
        <t-button theme="primary" @click="sureDelete" :loading="submitLoading">{{lang.sure}}</t-button>
        <t-button theme="default" @click="delVisible=false">{{lang.cancel}}</t-button>
      </template>
    </t-dialog>
  </com-config>
</div>

<script src="/plugins/addon/e_contract/template/admin/js/lang.js"></script>
<script src="/plugins/addon/e_contract/template/admin/api/e_contract.js"></script>
<script src="/plugins/addon/e_contract/template/admin/js/contract_template.js"></script>
