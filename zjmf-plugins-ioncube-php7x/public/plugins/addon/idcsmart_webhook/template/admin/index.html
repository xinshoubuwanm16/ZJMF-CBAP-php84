<link rel="stylesheet" href="/plugins/addon/idcsmart_webhook/template/admin/css/index.css" />
<!-- =======内容区域======= -->
<div id="content" class="webhook" v-cloak>
  <com-config>
    <t-card class="list-card-container">
      <div class="webhook-box">
        <div class="table-title">Webhook</div>
        <div class="table-add">
          <div>
            <div>{{lang.webhook_text8}}</div>
            <div class="table-tips">{{lang.webhook_text10}}</div>
          </div>
          <t-button v-permission="'auth_idcsmart_webhook_edit_webhook'" theme="primary"
            @click="addWebhook">{{lang.webhook_text9}}
          </t-button>
        </div>
        <t-table row-key="id" :data="data" :hover="true" :loading="loading" size="medium" :columns="columns"
          :lazy-load="true">
          <template #url_mame="{row}">
            <span>{{ row.software === 'telegram' ? row.token : row.url }}</span>
          </template>
          <template #software="{row}">
            <span>{{software[row.software] || '--' }}</span>
          </template>
          <template #op="{row}">
            <t-tooltip :content="lang.webhook_text6" :show-arrow="false" theme="light">
              <t-icon v-permission="'auth_idcsmart_webhook_edit_webhook'" @click="editWebhook(row)" name="edit-1"
                class="common-look"></t-icon>
            </t-tooltip>
            <t-tooltip :content="lang.webhook_text7" :show-arrow="false" theme="light">
              <t-icon v-permission="'auth_idcsmart_webhook_edit_webhook'" @click="delWebhook(row)" name="delete"
                class="common-look"></t-icon>
            </t-tooltip>
          </template>
        </t-table>

        <p class="com-tit" style="margin-top: 50px;"><span>{{ lang.webhook_text11 }}</span></p>
        <div class="table-add">
          <div class="table-tips">{{lang.webhook_text10}}</div>
          <t-button v-permission="'auth_idcsmart_webhook_edit_notice'" theme="primary"
            @click="addWebhookNotice">{{lang.webhook_text9}}</t-button>
        </div>
        <t-table row-key="id" :data="noticeData" :hover="true" :loading="noticeLoading" size="medium"
          :columns="noticeColumns" :lazy-load="true">
          <template #software="{row}">
            <span v-if="row.software === 'telegram'">{{row.webhook_name +  '(' + row.chat_id + ')' || '--' }}</span>
            <span v-else>{{row.webhook_name || '--' }}</span>
          </template>
          <template #status="{row}">
            <t-switch :disabled="!$checkPermission('auth_idcsmart_webhook_edit_notice')" size="medium"
              :custom-value="[1,0]" v-model="row.status" @change="()=>changeStatus(row)"></t-switch>
          </template>

          <template #op="{row}">
            <t-tooltip :content="lang.webhook_text6" :show-arrow="false" theme="light">
              <t-icon v-permission="'auth_idcsmart_webhook_edit_notice'" @click="editWebhookNotice(row)" name="edit-1"
                class="common-look"></t-icon>
            </t-tooltip>
            <t-tooltip :content="lang.webhook_text7" :show-arrow="false" theme="light">
              <t-icon v-permission="'auth_idcsmart_webhook_edit_notice'" @click="delWebhookNotice(row)" name="delete"
                class="common-look"></t-icon>
            </t-tooltip>
          </template>
        </t-table>

        <!-- Webhook配置 -->
        <t-dialog :header="editId ? lang.webhook_text22 : lang.webhook_text16" :visible.sync="webhookVisble"
          :footer="false" width="650" @closed="materialDiaClose">
          <t-form :rules="rules" ref="userDialog" :data="webhookForm" @submit="onWebhookSubmit" reset-type="initial"
            label-align="top">
            <t-form-item :label="lang.webhook_text3" name="name">
              <t-input style="width: 100%;" v-model="webhookForm.name" :placeholder="lang.webhook_text3"></t-input>
            </t-form-item>
            <t-form-item :label="lang.webhook_text4" name="software">
              <t-select v-model="webhookForm.software" :placeholder="lang.webhook_text4">
                <t-option v-for="item in softwareOptions" :value="item.value" :label="item.label" :key="item.value">
                </t-option>
              </t-select>
            </t-form-item>
            <t-form-item :label="lang.webhook_text17" name="url" v-if="webhookForm.software !== 'telegram'">
              <template #help>
                <div class="common-look" style="text-align: right;" slot="help" @click="goHelp">{{lang.webhook_text18}}
                </div>
              </template>
              <t-input style="width: 100%;" v-model="webhookForm.url" :placeholder="lang.webhook_text17"></t-input>
            </t-form-item>
            <t-form-item label="token" name="token" v-if="webhookForm.software === 'telegram'">
              <template #help>
                <div class="common-look" style="text-align: right;" slot="help" @click="goHelp">{{lang.webhook_text18}}
                </div>
              </template>
              <t-input style="width: 100%;" v-model="webhookForm.token" :placeholder="lang.webhook_text32"></t-input>
            </t-form-item>

            <div class="com-f-btn">
              <t-button theme="primary" type="submit" :loading="submitLoading">{{lang.webhook_text23}}</t-button>
              <t-button theme="default" variant="base" @click="materialDiaClose">{{lang.webhook_text24}}</t-button>
            </div>
          </t-form>
        </t-dialog>
        <!-- 通知 -->
        <t-dialog :header="noticeEditId ? lang.webhook_text31 : lang.webhook_text30" :visible.sync="webNoticeVisble"
          :footer="false" width="650" @closed="noticeDiaClose">
          <t-form :rules="rules" label-align="top" ref="noticeDialog" :data="webNoticeForm" @submit="onWebNoticeSubmit"
            reset-type="initial">

            <t-form-item :label="lang.webhook_text12" name="notice_setting_name">
              <t-select v-model="webNoticeForm.notice_setting_name" :placeholder="lang.webhook_text12">
                <t-option v-for="item in sendList" :value="item.name" :label="item.name_lang" :key="item.name">
                </t-option>
              </t-select>
            </t-form-item>
            <t-form-item :label="lang.webhook_text13" name="webhook_id">
              <t-select v-model="webNoticeForm.webhook_id" :placeholder="lang.webhook_text13">
                <t-option v-for="item in data" :value="item.id" :label="item.name" :key="item.id">
                </t-option>
              </t-select>
            </t-form-item>
            <t-form-item :label="lang.webhook_text19" name="chat_id" v-if="isShowChatid">
              <t-input style="width: 100%;" v-model="webNoticeForm.chat_id" :placeholder="lang.webhook_text19">
              </t-input>
            </t-form-item>
            <t-form-item :label="lang.webhook_text20" name="content">
              <t-textarea v-model="webNoticeForm.content" :placeholder="lang.webhook_text20"></t-textarea>
            </t-form-item>
            <t-form-item :label="lang.webhook_text33" name="personnel">
              <t-textarea v-model="webNoticeForm.personnel"
                :placeholder="isShowChatid ? lang.webhook_text21 : lang.webhook_text34"></t-textarea>
            </t-form-item>
            <div class="com-f-btn">
              <t-button theme="primary" type="submit" :loading="submitLoading">{{lang.webhook_text23}}</t-button>
              <t-button theme="default" variant="base" @click="noticeDiaClose">{{lang.webhook_text24}}</t-button>
            </div>
          </t-form>
        </t-dialog>
        <!-- 删除 -->
        <t-dialog theme="warning" :header="delTip" :visible.sync="delVisible">
          <template slot="footer">
            <t-button theme="primary" @click="sureDel" :loading="submitLoading">{{lang.oss_text28}}</t-button>
            <t-button theme="default" @click="delVisible = false">{{lang.oss_text20}}</t-button>
          </template>
        </t-dialog>
      </div>
    </t-card>
  </com-config>
</div>
<!-- =======页面独有======= -->
<script src="/plugins/addon/idcsmart_webhook/template/admin/api/index.js"></script>
<script src="/plugins/addon/idcsmart_webhook/template/admin/lang/index.js"></script>
<script src="/plugins/addon/idcsmart_webhook/template/admin/js/index.js"></script>
