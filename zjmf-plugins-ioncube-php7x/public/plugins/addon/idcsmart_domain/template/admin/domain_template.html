<link rel="stylesheet" href="/plugins/addon/idcsmart_domain/template/admin/css/domain.css" />
<!-- =======内容区域======= -->
<div id="content" class="domain_list" v-cloak>

  <com-config>
    <t-card class="list-card-container">
      <ul class="common-tab">
        <li v-permission="'auth_idcsmart_domain_list_view'">
          <a href="index.htm">{{lang.domain_list}}</a>
        </li>
        <li v-permission="'auth_idcsmart_domain_template_view'">
          <a href="template_mangment.htm">{{lang.domain_template}}</a>
        </li>
        <li class="active" v-permission="'auth_idcsmart_domain_server_view'">
          <a href="javascript:;">{{lang.domain_module}}</a>
        </li>
        <li v-permission="'auth_idcsmart_domain_configuration_view'">
          <a href="domain_setting.htm">{{lang.basic_setting}}</a>
        </li>
      </ul>
      <t-table row-key="id" :data="data" size="medium" :columns="columns" :hover="hover" :loading="loading"
        :table-layout="tableLayout ? 'auto' : 'fixed'" @sort-change="sortChange" :hide-sort-tips="hideSortTips"
        drag-sort="row-handler" @drag-sort="changeSort">
        <template slot="sortIcon">
          <t-icon name="caret-down-small"></t-icon>
        </template>
        <template #drag="{row}">
          <t-icon name="move"></t-icon>
        </template>
        <template #username="{row}">
          <a :href="`client_detail.htm?client_id=${row.client_id}`" class="aHover">
            <template>
              <span v-if="row.username">{{row.username}}</span>
              <span v-else-if="row.phone">+{{row.phone_code}}-{{row.phone}}</span>
              <span v-else="row.email">{{row.email}}</span>
            </template>
            <span v-if="row.company">({{row.company}})</span>
          </a>
        </template>
        <template #increase_percent="{row}">
          {{row.increase_percent}}%
        </template>
        <template #register_time="{row}">
          {{row.register_time ? moment(row.start_time * 1000).format('YYYY-MM-DD hh:mm:ss') : '--'}}
        </template>
        <template #transfer="{row}">
          <t-switch size="medium" :custom-value="[1,0]" :value="row.transfer" @change="changeStatus(row, 'transfer')" :disabled="!$checkPermission('auth_idcsmart_domain_server_configuration')">
          </t-switch>
        </template>
        <template #certification="{row}">
          <t-switch size="medium" :custom-value="[1,0]" :value="row.certification"
            @change="changeStatus(row, 'certification')" :disabled="!$checkPermission('auth_idcsmart_domain_server_configuration')">
          </t-switch>
        </template>
        <template #op="{row}">
          <t-tooltip :content="lang.look" :show-arrow="false" theme="light">
            <t-icon name="view-module" class="common-look" @click="lookDetails(row)" v-permission="'auth_idcsmart_domain_server_configuration'">
            </t-icon>
          </t-tooltip>
          <t-tooltip :content="lang.suffix_manage" :show-arrow="false" theme="light">
            <t-icon name="setting" class="common-look" @click="suffixManage(row)" v-permission="'auth_idcsmart_domain_server_domain_suffix'">
            </t-icon>
          </t-tooltip>
        </template>
      </t-table>
      <!-- 后缀管理 -->
      <div class="suffix_manage" v-if="showSuffix">
        <div class="suffix-top">
          <span class="t-tip">{{lang.domain_tip4}}</span>
          <t-button @click="addSuffix" v-permission="'auth_idcsmart_domain_server_domain_suffix_create_suffix'">{{lang.order_text53}}{{lang.suffix}}</t-button>
        </div>
        <t-table row-key="id" :data="suffixData" :columns="suffixColumns" :loading="suffixLoading" :max-height="500">
          <template #allow_zh="{row}">
            <t-switch size="medium" :custom-value="[1,0]" :value="row.allow_zh" @change="changeZh(row)" :disabled="!$checkPermission('auth_idcsmart_domain_server_domain_suffix_update_suffix')">
            </t-switch>
          </template>
          <template #op="{row}">
            <t-tooltip :content="lang.edit" :show-arrow="false" theme="light">
              <t-icon name="edit" class="common-look" @click="editItem(row)" v-permission="'auth_idcsmart_domain_server_domain_suffix_update_suffix'">
              </t-icon>
            </t-tooltip>
            <t-tooltip :content="lang.delete" :show-arrow="false" theme="light">
              <t-icon name="delete" class="common-look" @click="delItem(row)" v-permission="'auth_idcsmart_domain_server_domain_suffix_delete_suffix'">
              </t-icon>
            </t-tooltip>
          </template>
        </t-table>
      </div>
    </t-card>
    <!-- 添加/编辑后缀 -->
    <t-dialog :visible.sync="visible" :header="suffixTitle" :on-close="close" :footer="false" width="600">
      <t-form :rules="rules" ref="suffixDialog" :data="suffixForm" @submit="submitSuffix" :label-width="120"
        class="temp_form">
        <t-form-item :label="lang.suffix" name="suffix">
          <t-input :placeholder="lang.suffix" v-model="suffixForm.suffix" :disabled="optType === 'update'"></t-input>
        </t-form-item>
        <t-form-item :label="lang.suffix_profile" name="suffix_profile">
          <t-input :placeholder="lang.domain_tip7" v-model="suffixForm.description" :maxlength="20"></t-input>
        </t-form-item>
        <t-form-item :label="lang.allow_chinese">
          <t-switch size="medium" :custom-value="[1,0]" v-model="suffixForm.allow_zh"
          :disabled="!$checkPermission('auth_idcsmart_domain_server_domain_suffix_update_suffix')">
          </t-switch>
          <span class="s-tip">{{lang.domain_tip5}}</span>
        </t-form-item>
        <div class="com-f-btn">
          <t-button theme="primary" type="submit" :loading="submitLoading">{{lang.hold}}</t-button>
          <t-button theme="default" variant="base" @click="visible=false">{{lang.cancel}}</t-button>
        </div>
      </t-form>
    </t-dialog>
    <!-- 查看编辑模块 -->
    <t-dialog :visible.sync="tempVisible" :header="domainName" :on-close="close" :footer="false" :width="calcWidth">
      <t-form :rules="tempRules" ref="userDialog" :data="tempData" @submit="submitTemp" :label-width="120"
        class="module_form">
        <t-form-item :label="lang.price_float" name="increase_percent"
          :rules="[ { required: true, message: `${lang.input}${lang.price_float}`, type: 'error' }]">
          <t-input-number theme="normal" :min="0" :decimal-places="2" :placeholder="lang.price_float"
            v-model="tempData.increase_percent"></t-input-number>
        </t-form-item>
        <t-form-item :label="`${lang.allow}${lang.acounts_transfer}`">
          <t-switch size="medium" :custom-value="[1,0]" v-model="tempData.transfer">
          </t-switch>
        </t-form-item>
        <t-form-item :label="lang.need_real_name">
          <t-switch size="medium" :custom-value="[1,0]" v-model="tempData.certification">
          </t-switch>
        </t-form-item>
        <div class="com-f-btn">
          <t-button theme="primary" type="submit" :loading="submitLoading">{{lang.hold}}</t-button>
          <t-button theme="default" variant="base" @click="tempVisible=false">{{lang.cancel}}</t-button>
        </div>
      </t-form>
    </t-dialog>
    <!-- 删除提示框 -->
    <t-dialog theme="warning" :header="lang.sureDelete" :close-btn="false" :visible.sync="delVisible"
      class="deleteDialog">
      <template slot="footer">
        <t-button theme="primary" @click="sureDelete" :loading="submitLoading">{{lang.sure}}</t-button>
        <t-button theme="default" @click="delVisible=false">{{lang.cancel}}</t-button>
      </template>
    </t-dialog>
  </com-config>

</div>


<script src="/plugins/addon/idcsmart_domain/template/admin/js/lang.js"></script>
<script src="/plugins/addon/idcsmart_domain/template/admin/api/domain.js"></script>
<script src="/plugins/addon/idcsmart_domain/template/admin/js/domain_template.js"></script>
