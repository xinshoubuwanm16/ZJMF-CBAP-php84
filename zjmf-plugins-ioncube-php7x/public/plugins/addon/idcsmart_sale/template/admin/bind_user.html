<link rel="stylesheet" href="/plugins/addon/idcsmart_sale/template/admin/css/sales_management.css" />
<div id="content" class="admin table" v-cloak>
  <com-config>
    <t-card class="list-card-container">
      <ul class="common-tab">
        <li>
          <a href="sale_setting.htm">{{lang.sales_plugin_text2}}</a>
        </li>
        <li>
          <a href="sale_manage.htm">{{lang.sales_plugin_text3}}</a>
        </li>
        <li class="active">
          <a href="javascript:; ">{{lang.sales_plugin_text72}}</a>
        </li>
      </ul>
      <div class="common-header">
        <t-button @click="handelAddSale" class="add">{{lang.sale_text3}}</t-button>
        <div class="com-search">
          <t-input v-model="params.keywords" class="search-input" :placeholder="lang.sale_text4"
            @keyup.enter.native="seacrh" :on-clear="clearKey" clearable>
          </t-input>
          <t-icon size="20px" name="search" @click="seacrh" class="com-search-btn" />
        </div>
      </div>
      <t-table :row-key="data.id" :data="data" size="medium" :columns="columns" :hover="hover" :loading="loading"
        :table-layout="tableLayout ? 'auto' : 'fixed'" :max-height="maxHeight">
        <template #username="{row}">
          <span @click="goUserDetail(row)" class="act-text">{{row.username}}{{row.company ? '(' + row.company + ')' :
            '(--)'}}</span>
        </template>
        <template #create_time="{row}">
          <span>{{formatDate(row.create_time)}}</span>
        </template>
        <template #op="{row}">
          <t-tooltip :content="lang.update" :show-arrow="false" theme="light">
            <t-icon name="edit-1" class="common-look" @click="updateAdmin(row)">
            </t-icon>
          </t-tooltip>
          <t-tooltip :content="lang.delete" :show-arrow="false" theme="light">
            <t-icon name="delete" class="common-look" @click="deleteUser(row)">
            </t-icon>
          </t-tooltip>
        </template>
      </t-table>
      <t-pagination show-jumper :total="total" :page-size="params.limit" :page-size-options="pageSizeOptions"
        :on-change="changePage" :current="params.page" />
    </t-card>

    <!-- 添加绑定用户 -->
    <t-dialog :visible.sync="visible" :header="addTip" :on-close="close" :footer="false" width="600">
      <t-form :rules="rules" :data="formData" ref="userDialog" @submit="onSubmit" v-if="visible">
        <t-form-item :label="lang.sale_text5" name="client_id">
          <com-choose-user :user-id="formData.client_id" :check-id="formData.client_id"
            :disabled="addTip === lang.sale_text6" :pre-placeholder="lang.sale_text7" @changeuser="changeUser"
            :all="false">
          </com-choose-user>
        </t-form-item>
        <t-form-item :label="lang.sale_text8" name="sale_id">
          <t-select :placeholder="lang.sale_text9" filterable clearable v-model="formData.sale_id" :options="sale_list"
            :keys="{ label: 'name', value: 'id'}"></t-select>
        </t-form-item>
        <div class="f-btn">
          <t-button theme="primary" type="submit" :loading="submitLoading">{{lang.hold}}</t-button>
          <t-button theme="default" variant="base" @click="close">{{lang.cancel}}</t-button>
        </div>
      </t-form>
    </t-dialog>
    <!-- 删除弹窗 -->
    <t-dialog theme="warning" :header="lang.sureDelete" :visible.sync="delVisible">
      <template slot="footer">
        <t-button theme="primary" @click="sureDel" :loading="submitLoading">{{lang.sure}}</t-button>
        <t-button theme="default" @click="delVisible=false">{{lang.cancel}}</t-button>
      </template>
    </t-dialog>
  </com-config>
</div>
<!-- =======页面独有======= -->
<script src="/plugins/addon/idcsmart_sale/template/admin/js/lang.js"></script>

<script src="/{$template_catalog}/template/{$themes}/components/comChooseUser/comChooseUser.js"></script>
<script src="/plugins/addon/idcsmart_sale/template/admin/api/sales.js"></script>
<script src="/plugins/addon/idcsmart_sale/template/admin/js/bind_user.js"></script>
