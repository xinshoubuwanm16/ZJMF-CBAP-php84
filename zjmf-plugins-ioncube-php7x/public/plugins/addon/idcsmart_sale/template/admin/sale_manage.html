<link rel="stylesheet" href="/plugins/addon/idcsmart_sale/template/admin/css/sales_management.css" />
<div id="content" class="admin table" v-cloak>
 <com-config>
  <t-card class="list-card-container">
    <ul class="common-tab">
      <li>
        <a href="sale_setting.htm">{{lang.sales_plugin_text2}}</a>
      </li>
      <li class="active">
        <a href="javascript:;">{{lang.sales_plugin_text3}}</a>
      </li>
      <li>
        <a href="bind_user.htm">{{lang.sales_plugin_text72}}</a>
      </li>
    </ul>
    <div class="common-header">
      <t-button @click="handelAddSale" class="add">{{lang.sale_text106}}</t-button>
      <div class="com-search">
        <t-input v-model="params.keywords" class="search-input" :placeholder="lang.sale_text107"
          @keyup.enter.native="seacrh" :on-clear="clearKey" clearable>
        </t-input>
        <t-icon size="20px" name="search" @click="seacrh" class="com-search-btn" />
      </div>
    </div>
    <t-table row-key="1" :data="data" size="medium" :columns="columns" :hover="hover" :loading="loading"
      :table-layout="tableLayout ? 'auto' : 'fixed'">
      <template #op="{row}">
        <t-tooltip :content="row.status ? lang.disable : lang.enable" :show-arrow="false" theme="light">
          <t-icon :name="row.status ? 'minus-circle' : 'play-circle-stroke'" class="common-look"
            @click="changeStatus(row)">
          </t-icon>
        </t-tooltip>
        <t-tooltip :content="lang.update" :show-arrow="false" theme="light">
          <t-icon name="edit-1" class="common-look" @click="updateAdmin(row)">
          </t-icon>
        </t-tooltip>
        <t-tooltip :content="lang.delete" :show-arrow="false" theme="light">
          <t-icon name="delete" class="common-look" @click="deleteUser(row)">
          </t-icon>
        </t-tooltip>
      </template>
    </t-table>
    <t-pagination show-jumper :total="total" :page-size="params.limit" :page-size-options="pageSizeOptions"
      :on-change="changePage" :current="params.page" />
  </t-card>

  <!-- 添加销售 -->
  <t-dialog :visible.sync="visible" :header="addTip" :on-close="close" :footer="false" width="600">
    <t-form :rules="rules" :data="formData" ref="userDialog" @submit="onSubmit" class="saleForm">
      <t-form-item :label="lang.sale_text108" name="admin_id">
        <t-select :placeholder="lang.sale_text109" :disabled="addTip === lang.sale_text124" filterable
          :clearable="addTip !== lang.sale_text124" v-model="formData.admin_id" :options="select_admin_list"
          :keys="{ label: 'name', value: 'id'}"></t-select>
      </t-form-item>
      <t-form-item :label="lang.sale_text110" name="name">
        <t-input v-model="formData.name" :placeholder="lang.sale_text111" clearable></t-input>
      </t-form-item>
      <t-form-item :label="lang.sale_text112" name="sale_number">
        <t-input v-model="formData.sale_number" :placeholder="lang.sale_text113" clearable></t-input>
      </t-form-item>
      <!-- <t-form-item label="telegram" name="telegram">
        <t-input placeholder="请输入telegram" clearable v-model="formData.telegram"/>
      </t-form-item> -->
      <!-- <t-form-item label="telegram id" name="telegram_id">
        <t-input placeholder="请输入telegram id" :maxlength="10" clearable v-model="formData.telegram_id"/>
      </t-form-item> -->
      <t-form-item :label="lang.email" name="email">
        <t-input :placeholder="lang.input+lang.email" clearable v-model="formData.email"></t-input>
      </t-form-item>
      <t-form-item label="skype" name="skype">
        <t-input :placeholder="`${lang.input}skype`" clearable v-model="formData.skype" />
      </t-form-item>
      <t-form-item :label="lang.sales_plugin_text29" name="url" v-if="addTip === lang.sale_text124">
        <!-- <t-input placeholder="请输入邀请链接" clearable v-model="formData.url"/> -->
        <span>{{formData.url}}</span>
      </t-form-item>
      <div class="f-btn">
        <t-button theme="primary" type="submit" :loading="submitLoading">{{lang.hold}}</t-button>
        <t-button theme="default" variant="base" @click="close">{{lang.cancel}}</t-button>
      </div>
    </t-form>
  </t-dialog>

  <!-- 删除弹窗 -->
  <t-dialog theme="warning" :header="lang.sureDelete" :visible.sync="delVisible">
    <template slot="footer">
      <t-button theme="primary" @click="sureDel" :loading="submitLoading">{{lang.sure}}</t-button>
      <t-button theme="default" @click="delVisible=false">{{lang.cancel}}</t-button>
    </template>
  </t-dialog>

  <!-- 启用/停用 -->
  <t-dialog theme="warning" :header="statusTip" :visible.sync="statusVisble">
    <template slot="footer">
      <t-button theme="primary" @click="sureChange" :loading="submitLoading">{{lang.sure}}</t-button>
      <t-button theme="default" @click="closeDialog">{{lang.cancel}}</t-button>
    </template>
  </t-dialog>
 </com-config>
</div>
<!-- =======页面独有======= -->
<script src="/plugins/addon/idcsmart_sale/template/admin/js/lang.js"></script>

<script src="/plugins/addon/idcsmart_sale/template/admin/api/sales.js"></script>
<script src="/plugins/addon/idcsmart_sale/template/admin/js/sales_management.js"></script>
