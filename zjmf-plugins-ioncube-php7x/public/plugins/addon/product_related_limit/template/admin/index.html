<link rel="stylesheet" href="/plugins/addon/product_related_limit/template/admin/css/index.css" />

<!-- =======内容区域======= -->
<div id="content" class="stock" v-cloak>
  <com-config>
    <t-card class="list-card-container">
      <div class="material-box">
        <div class="material-top">
          <div class="left-title">
            <h3>{{lang.single_product_text1}}</h3>
            <div>{{lang.single_product_text2}}</div>
            <div style="color: var(--td-text-color-placeholder);"><span
                style="color: var(--td-error-color);">*</span>{{lang.single_product_text26}}</div>
          </div>
          <div class="right-btn" v-permission="'auth_product_related_limit_create_product'">
            <t-button @click="handADDmaterial">{{lang.single_product_text3}}</t-button>
          </div>
        </div>
        <t-table hover row-key="index" :loading="loading" :data="list" :columns="columns">
          <template #related_product_name="{row}">
            <span>{{calcProductName(row.related_product_name)}}</span>
          </template>
          <template #type="{row}">
            <span>{{typeObj[row.type]}}</span>
          </template>
          <template #status="{row}">
            <t-switch size="large" :custom-value="[1,0]" v-model="row.status" @change="onChange(row)"
              :disabled="!$checkPermission('auth_product_related_limit_on_off')"></t-switch>
          </template>
          <template #op="slotProps">
            <t-icon name="edit-1" color="#0052D9" style="margin-right: 10px;" @click="edit(slotProps.row)"
              class="common-look" v-permission="'auth_product_related_limit_update_product'"></t-icon>
            <t-icon name="delete" color="#0052D9" class="common-look" @click="deletes(slotProps.row.id)"
              v-permission="'auth_product_related_limit_delete_product'">
            </t-icon>
          </template>
        </t-table>
        <t-pagination show-jumper v-if="total" :total="total" :page-size="params.limit" :current="params.page"
          :page-size-options="pageSizeOptions" @change="changePage" />
      </div>
    </t-card>
    <!-- 删除提示框 -->
    <t-dialog theme="warning" :header="lang.single_product_text13" :close-btn="false" :visible.sync="delVisible"
      class="delDialog">
      <template slot="footer">
        <t-button theme="primary" @click="sureDelUser"
          :loading="submitLoading">{{lang.single_product_text14}}</t-button>
        <t-button theme="default" @click="delVisible=false">{{lang.single_product_text15}}</t-button>
      </template>
    </t-dialog>

    <!-- 创建字段弹窗 -->
    <t-dialog :header="editId ? lang.single_product_text16 : lang.single_product_text17" :visible.sync="materialVisble"
      :footer="false" width="650" @closed="materialDiaClose">
      <t-form :rules="rules" ref="userDialog" :data="formData" @submit="onSubmit" :label-width="180"
        reset-type="initial" v-if="materialVisble">
        <t-form-item :label="lang.single_product_text4" name="product_id">
          <com-tree-select @choosepro="choosePro" :all-products="allProducts" :value="formData.product_id"
            :disabled="editId != null">
          </com-tree-select>
        </t-form-item>
        <t-form-item :label="lang.single_product_text5" name="related_product_id">
          <com-tree-select @choosepro="choosePro2" :all-products="allProducts" :multiple="true"
            :value="formData.related_product_id">
          </com-tree-select>
        </t-form-item>
        <t-form-item :label="lang.single_product_text6">
          <t-radio-group v-model="formData.type">
            <t-radio :value="0">{{lang.single_product_text9}}</t-radio>
            <!-- <t-radio :value="1">{{lang.single_product_text10}}</t-radio> -->
            <!-- <t-radio :value="2">{{lang.single_product_text11}}</t-radio> -->
          </t-radio-group>
          <template #help>
            <div>{{lang.single_product_text19}}</div>
            <!-- <div>
              {{lang.single_product_text20}}
              <span style="color: var(--td-error-color);">{{lang.single_product_text21}}</span>
              {{lang.single_product_text22}}
            </div> -->
            <!-- <div>
              {{lang.single_product_text23}}
              <span style="color: var(--td-error-color);">{{lang.single_product_text24}}</span>
              {{lang.single_product_text25}}
            </div> -->
          </template>
        </t-form-item>
        <div class="com-f-btn">
          <t-button theme="primary" type="submit" :loading="submitLoading">{{lang.single_product_text18}}</t-button>
          <t-button theme="default" variant="base" @click="materialVisble=false">{{lang.single_product_text15}}
          </t-button>
        </div>
      </t-form>
    </t-dialog>
  </com-config>
</div>


<script src="/plugins/addon/product_related_limit/template/admin/js/lang.js"></script>
<script src="/{$template_catalog}/template/{$themes}/components/comTreeSelect/comTreeSelect.js"></script>
<script src="/plugins/addon/product_related_limit/template/admin/api/index.js"></script>
<script src="/plugins/addon/product_related_limit/template/admin/js/index.js"></script>
