<!-- 页面独有样式 -->
<link rel="stylesheet" href="/plugins/server/mf_cloud_disk/template/clientarea/pc/default/css/cloudList.css">
<div id="cloudList">
  <!-- 自己的东西 -->
  <div class="main-card">
    <div class="main-card-title">
      <span class="title-text">{{lang.cloud_title}}</span>
      <!-- <div class="add-btn" @click="toOrder">
                <i class="el-icon-plus"></i>
                添加
              </div> -->
    </div>

    <!-- 表格 -->
    <div class="main-card-table">
      <product-filter :tab.sync="params.tab" @change="inputChange" :count="expiring_count"></product-filter>

      <!-- 筛选 -->
      <div class="main-card-search">
        <batch-renewpage :tab="params.tab" :ids="multipleSelection" module-type="mf_cloud_disk" @success="inputChange"
          ref="batchRenewRef">
        </batch-renewpage>
        <div class="right-search">
          <!-- 数据中心 -->
          <el-select v-model="params.data_center_id" @change="centerSelectChange" style="width:3.2rem;"
            :filterable="true" :clearable="true" :placeholder="lang.cloud_tip_1" v-if="center.length > 0">
            <el-option v-for="item in center" :key="item.id" :value="item.id" :label="item.label">
              <div class="center-option-label">
                <img :src="'/upload/common/country/' + item.iso + '.png'" class="area-img">
                <span class="option-text">{{item.label}}</span>
              </div>
            </el-option>
          </el-select>
          <!-- 产品状态 -->
          <el-select v-model="params.status" @change="statusSelectChange"
            :placeholder="lang.com_config.select_pro_status" style="width:3.2rem;" clearable>
            <el-option v-for="item in statusSelect" :key="item.id" :value="item.status" :label="item.label"></el-option>
          </el-select>
          <el-input v-model="params.keywords" style="width: 3.2rem;"
            :placeholder="`${lang.placeholder_pre1}${lang.common_cloud_label18}`" clearable
            @clear="clearKey" @keyup.enter.native="inputChange">
          </el-input>
          <div class="search-btn" @Click="inputChange">{{lang.baidu_plugin_text7}}</div>
        </div>
      </div>
      <div class="table">
        <el-table v-loading="loading" :data="cloudData" style="width: 100%;margin-bottom: .2rem;"
          @selection-change="handleSelectionChange" @row-click="($event,event)=>toDetail($event,event)" border>
          <el-table-column type="selection" width="60" :show-overflow-tooltip="true">
          </el-table-column>
          <el-table-column prop="name" :label="lang.common_cloud_label18" min-width="180" :show-overflow-tooltip="true">
            <template slot-scope="scope">
              <div>
                {{scope.row.name && scope.row.status!== 'Deleted'?scope.row.name:'--'}}
              </div>
            </template>
          </el-table-column>
          <el-table-column :label="item.field_name" min-width="150" :show-overflow-tooltip="true"
            v-for="item in self_defined_field" :key="item.id + 'fff'">
            <template slot-scope="{row}">
              <span :class="item.field_type === 'textarea' ? 'word-pre' : ''">{{row.self_defined_field[item.id]
                ||'--'}}</span>
            </template>
          </el-table-column>
          <el-table-column :label="lang.cloud_table_head_1" min-width="180" :show-overflow-tooltip="true"
          v-if="center.length > 0">
            <template slot-scope="scope">
              <div class="area" v-if="scope.row.country">
                <img :src="'/upload/common/country/' + scope.row.country_code + '.png'" class="area-img">
                <span class="area-country">{{scope.row.country}}</span>
                <span>-{{scope.row.city}}-{{scope.row.area}}</span>
              </div>
              <div v-else>--</div>
            </template>
          </el-table-column>
          <el-table-column prop="id" :label="lang.finance_label4" width="120" align="left">
            <template slot-scope="scope">
              <div class="status"
                :style="'color:'+status[scope.row.status].color + ';background:' + status[scope.row.status].bgColor">
                {{status[scope.row.status].text }}
              </div>
            </template>
          </el-table-column>
          <!-- 计费周期 -->
          <el-table-column prop="size" :label="lang.common_cloud_label20" width="100" :show-overflow-tooltip="true">
            <template slot-scope="scope">
              <span v-if="scope.row.size">{{scope.row.size}}G</span>
              <span v-else>--</span>
            </template>
          </el-table-column>
          <el-table-column prop="rel_host_name" :label="lang.rel_host_name" min-width="180"
            :show-overflow-tooltip="true">
            <template slot-scope="scope">
              <a :href="`productdetail.htm?id=${scope.row.rel_host_id}`" class="cloud-name"
                v-if="scope.row.rel_host_name">
                <span class="packge-name">{{ scope.row.rel_host_name }}（{{ scope.row.rel_host_id }}）</span>
              </a>
              <span v-else>--</span>
            </template>
          </el-table-column>
          <el-table-column prop="due_time" :label="lang.cloud_table_head_4" width="200">
            <template slot-scope="scope">
              {{scope.row.due_time | formateTime}}
            </template>
          </el-table-column>
          <el-table-column prop="client_notes" :label="lang.invoice_text139" min-width="100"
            :show-overflow-tooltip="true">
            <template slot-scope="{row}">
              <span>{{row.client_notes || '--'}}</span>
            </template>
          </el-table-column>
          <el-table-column prop="op" :label="lang.finance_label6" width="100">
            <template slot-scope="{row}">
              <span class="idle" @click="handlerCancle(row)" v-if="row.rel_host_id">{{lang.idle}}</span>
              <span v-else>--</span>
            </template>
          </el-table-column>
        </el-table>
      </div>
      <div class="page">
        <pagination :page-data="params" @sizechange="sizeChange" @currentchange="currentChange" />
      </div>
    </div>
  </div>

  <!-- 取消关联 -->
  <div class="repass-dialog">
    <el-dialog width="6.8rem" :visible.sync="isShowConnect" :show-close=false @close="isShowConnect = false">
      <div class="dialog-title">
        {{lang.connect_tip1}}
      </div>
      <div class="dialog-main">
        <div class="label">{{lang.common_cloud_text36}}</div>
        <p>{{curIp}}</p>
      </div>
      <div class="dialog-footer">
        <div class="btn-ok" @click="submitConnect" v-loading="loading5">{{lang.common_cloud_btn28}}</div>
        <div class="btn-no" @click="isShowConnect = false">{{lang.common_cloud_btn29}}</div>
      </div>
    </el-dialog>
  </div>
</div>
<!-- =======页面独有======= -->
<script src="/plugins/server/mf_cloud_disk/template/clientarea/pc/default/lang/index.js"></script>
<script src="/plugins/server/mf_cloud_disk/template/clientarea/pc/default/api/cloud.js"></script>
<script src="/plugins/server/mf_cloud_disk/template/clientarea/pc/default/js/cloudList.js"></script>
